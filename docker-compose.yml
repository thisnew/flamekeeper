version: "3.8"

services:
  flamekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flamekeeper-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-production}
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - DATABASE_URL=file:/app/data/prod.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Initial admin account (used when the DB is first seeded)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-flamekeeper_admin@163.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-this-strong-password}
      # Outbound mail (SMTP) — 163 uses an 授权码, not the login password
      - SMTP_HOST=${SMTP_HOST:-smtp.163.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-flamekeeper_admin@163.com}
      - SMTP_PASS=${SMTP_PASS:-your-smtp-auth-code}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Eternal Flame 守焰者}
    volumes:
      # Persist SQLite database
      - flamekeeper-data:/app/data
      # Persist member-uploaded attachments (<=10MB shares)
      - flamekeeper-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/settings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  flamekeeper-data:
    name: flamekeeper-data
  flamekeeper-uploads:
    name: flamekeeper-uploads