version: "3.8"

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: flamekeeper-db
    restart: unless-stopped
    environment:
      # Anchor substitution so the healthcheck sees the same user/db as the container
      - POSTGRES_USER=${POSTGRES_USER:-flamekeeper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flamekeeper_pg_pw}
      - POSTGRES_DB=${POSTGRES_DB:-flamekeeper}
      # 中文排序/大小写行为更可控
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - flamekeeper-pgdata:/var/lib/postgresql/data
    # 仅绑定本机，避免把数据库暴露到公网；
    # 如需从局域网其他机器连开发库，改成 "5432:5432" 并自行加防火墙规则
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # 必须用 CMD-SHELL 而不是 CMD，因为 pg_isready 不是 Windows 路径上的可执行文件
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER:-flamekeeper} -d $${POSTGRES_DB:-flamekeeper}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- 应用 ----
  flamekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flamekeeper-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-production}
      # Public origin — must match the reverse proxy / NAT mapping so
      # cookies + email verification links resolve to this domain.
      - AUTH_URL=${AUTH_URL:-https://www.h83c4578f.nyat.app}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://www.h83c4578f.nyat.app}
      # Database — read from .env to point at a LAN PostgreSQL
      # (e.g. DATABASE_URL=postgresql://flamekeeper:<PW>@192.168.3.80:5432/flamekeeper?schema=public).
      # The fallback below targets the pg service bundled inside this compose.
      #
      # We avoid nested ${VAR:-...} defaults because some compose versions
      # do not re-expand inner variables, producing "invalid port number"
      # parse errors. Hard-code the literal string here; use .env to override.
      - DATABASE_URL=${DATABASE_URL:-postgresql://flamekeeper:flamekeeper_pg_pw@db:5432/flamekeeper?schema=public}
      # 初始 admin 账号（首次初始化数据库时使用）
      - ADMIN_EMAIL=${ADMIN_EMAIL:-flamekeeper_admin@163.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-this-strong-password}
      # 发信 SMTP（163 使用授权码，非登录密码）
      - SMTP_HOST=${SMTP_HOST:-smtp.163.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-flamekeeper_admin@163.com}
      - SMTP_PASS=${SMTP_PASS:-your-smtp-auth-code}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Eternal Flame 守焰者}
    volumes:
      # 成员上传的附件（<=10MB 分享）
      - flamekeeper-uploads:/app/public/uploads
    healthcheck:
      # /api/health 是公开的轻量级存活检查，不依赖数据库 / 鉴权；
      # 比 /api/settings 更安全（settings 接口未来可能要求登录）
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次启动要 init-db + seed，可能稍久；给 60s 缓冲
      start_period: 60s

volumes:
  flamekeeper-pgdata:
    name: flamekeeper-pgdata
  flamekeeper-uploads:
    name: flamekeeper-uploads
