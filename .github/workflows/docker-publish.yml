# === Flamekeeper CI/CD 镜像构建 ===
# Next.js 16 + Prisma 项目
# 推送 main / 打 v* tag / 手动触发时，构建镜像并推送到阿里云 ACR（个人版）。
#
# 镜像仓库：阿里云 ACR 个人版
#   地址硬编码在 env 中（非敏感信息）
#   登录凭据通过 GitHub Secrets 注入：
#     ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD
#
# 构建缓存在 Docker BuildKit + GitHub Actions cache (type=gha) 中
#   gha 缓存写入需要 actions: write，否则 cache-to 静默失败、每次都冷构建

name: Build and Push Docker Image

env:
  REGISTRY: crpi-bisd6rcwol3ac2v6.cn-hangzhou.personal.cr.aliyuncs.com/thisnew
  REGISTRY_HOST: crpi-bisd6rcwol3ac2v6.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE: flamekeeper
  # Baked into the image at build time as NEXT_PUBLIC_APP_URL (metadataBase +
  # OpenGraph absolute URLs). Next.js INLINES NEXT_PUBLIC_* at build time, so
  # this cannot be changed at deploy time -- changing it means rebuilding.
  #
  # The port is part of the origin: this project is served at :22247.
  # Keep this in sync with docker-compose.yml PUBLIC_ORIGIN and .env.example.
  PUBLIC_URL: https://www.h83c4578f.nyat.app:22247

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: 设置 Docker Buildx (container 驱动, 支持缓存导出)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 阿里云 ACR 个人版不支持 OCI attestation 媒体类型
          # (application/vnd.oci.empty.v1+json)，关闭 provenance/sbom 以兼容
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_APP_URL is read at build time (metadataBase, OG).
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.PUBLIC_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:git-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}

      - name: 输出镜像信息
        run: |
          echo "### 已推送镜像 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:git-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
